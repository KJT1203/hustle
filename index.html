<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Hustle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>">
<style>
/* Hallmark · genre: editorial · macrostructure: Workbench (app · broadsheet ledger) · theme: custom "Night Ledger" (dark broadsheet) · tone: after-hours financial paper · anchor hue: 60 · accent: brass 85 · enrichment: none · nav: N6 masthead · footer: none (app)
 * pre-emit critique: P5 H4 E4 S5 R4 V5
 */
:root{
  --color-paper:oklch(15.5% .006 60);--color-paper-2:oklch(21% .009 60);--color-paper-3:oklch(18.5% .008 60);
  --color-ink:oklch(93% .012 75);--color-ink-2:oklch(74% .014 70);--color-ink-3:oklch(55% .012 65);
  --color-rule:oklch(29% .01 60);--color-accent:oklch(80% .11 85);--color-accent-2:oklch(87% .09 88);
  --color-up:oklch(78% .14 155);--color-down:oklch(70% .16 25);--color-warn:oklch(76% .12 60);
  --color-scrim:oklch(5% 0 0 / .72);--color-focus:oklch(80% .11 85);
  --font-display:"Times New Roman",Times,serif;
  --font-body:"Times New Roman",Times,serif;
  --font-mono:"Times New Roman",Times,serif;
  --space-3xs:.25rem;--space-2xs:.5rem;--space-xs:.75rem;--space-sm:1rem;--space-md:1.5rem;--space-lg:2rem;--space-xl:3rem;
  --text-xs:.8125rem;--text-sm:.9375rem;--text-base:1.0625rem;--text-md:1.25rem;--text-lg:1.5rem;--text-xl:2.25rem;--text-2xl:3.25rem;
  --ease-out:cubic-bezier(.16,1,.3,1);--dur-short:140ms;
  --rule:1px solid var(--color-rule);--rule-ink:1px solid var(--color-ink);--radius:2px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:clip}
body{margin:0;background:var(--color-paper);color:var(--color-ink);font:400 var(--text-base)/1.5 var(--font-body);display:flex;flex-direction:column;height:100vh;overflow:hidden}
h1,h2,h3{font-family:var(--font-display);font-style:normal;font-weight:600;margin:0;letter-spacing:-.01em;overflow-wrap:anywhere;min-width:0}
p{margin:0}
b{font-weight:600}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums lining-nums}
.up{color:var(--color-up)}.dn{color:var(--color-down)}.warn{color:var(--color-warn)}.mut{color:var(--color-ink-2)}
.r{text-align:right}

/* masthead */
.mast{padding:var(--space-sm) var(--space-lg) 0;flex:none}
.mast-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:var(--space-sm)}
.dateline{font-size:var(--text-sm);color:var(--color-ink-2)}
.wordmark{font-size:var(--text-2xl);font-weight:700;line-height:.95;letter-spacing:-.035em;text-align:center}
.speed{justify-self:end;display:flex;gap:var(--space-3xs)}
.speed button{padding:.3rem .5rem;font-size:var(--text-xs);border-color:var(--color-rule)}
.speed button.on{background:var(--color-ink);border-color:var(--color-ink);color:var(--color-paper)}
.ticker{display:flex;flex-wrap:wrap;align-items:center;border-top:3px double var(--color-ink);border-bottom:var(--rule-ink);margin-top:var(--space-xs)}
.ticker>div{padding:var(--space-2xs) var(--space-md) var(--space-2xs) 0;margin-right:var(--space-md);border-right:var(--rule)}
.ticker small{font-size:var(--text-xs);color:var(--color-ink-2);margin-right:var(--space-2xs)}
.ticker b{font:600 var(--text-md) var(--font-mono);font-variant-numeric:tabular-nums lining-nums}
#inboxBtn{margin-left:auto}
nav{display:flex;gap:var(--space-md);overflow-x:auto;border-bottom:var(--rule);scrollbar-width:none}
nav button{border:0;border-radius:0;background:none;padding:var(--space-2xs) 0;font:500 var(--text-sm) var(--font-body);color:var(--color-ink-2);border-bottom:2px solid transparent}
nav button:hover:not(:disabled){background:none;color:var(--color-ink)}
nav button.on{color:var(--color-ink);border-bottom-color:var(--color-ink)}
nav .reset{margin-left:auto;color:var(--color-ink-3)}

.page{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 19rem}
main{overflow:auto;padding:var(--space-lg) var(--space-lg) var(--space-xl)}
aside{overflow:auto;border-left:var(--rule);padding:var(--space-md) var(--space-md) var(--space-lg)}
aside h2{font-size:var(--text-lg);padding-bottom:var(--space-2xs);border-bottom:var(--rule-ink);margin-bottom:var(--space-2xs)}
.lg{display:grid;grid-template-columns:2.25rem minmax(0,1fr);gap:var(--space-2xs);padding:var(--space-2xs) 0;border-bottom:var(--rule);font-size:var(--text-sm)}
.lg small{font:var(--text-xs) var(--font-mono);color:var(--color-ink-3);padding-top:.15em}
.lg.good{color:var(--color-ink)}.lg.bad span{color:var(--color-down)}
.lg.info{color:var(--color-ink-2)}

/* buttons */
button{font:500 var(--text-sm)/1.2 var(--font-body);color:var(--color-ink);background:transparent;border:var(--rule-ink);border-radius:var(--radius);padding:.5rem .75rem;cursor:pointer;white-space:nowrap;transition:background-color var(--dur-short) var(--ease-out),color var(--dur-short) var(--ease-out)}
button:hover:not(:disabled){background:var(--color-ink);color:var(--color-paper)}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
button:disabled{border-color:var(--color-rule);color:var(--color-ink-3);cursor:not-allowed}
button.pri{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-paper)}
button.pri:hover:not(:disabled){background:var(--color-accent-2);border-color:var(--color-accent-2)}
button.pri:disabled{background:transparent;border-color:var(--color-rule);color:var(--color-ink-3)}
button.bad{border-color:var(--color-down);color:var(--color-down)}
button.bad:hover:not(:disabled){background:var(--color-down);color:var(--color-paper-3)}
button.big{font-size:var(--text-base);padding:.8rem 1.25rem}

/* page furniture */
.lede{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--space-xl);align-items:end;padding-bottom:var(--space-md);border-bottom:var(--rule-ink)}
.headline{font-size:var(--text-xl);line-height:1.05;font-weight:600}
.dek{font-size:var(--text-md);line-height:1.45;color:var(--color-ink-2);margin-top:var(--space-2xs);max-width:36em;text-wrap:pretty}
.dek b{color:var(--color-ink)}
.side{display:flex;flex-direction:column;gap:var(--space-xs);align-items:flex-start}
.side .figure{font:600 var(--text-lg) var(--font-mono)}
h3{font-size:var(--text-md);margin:var(--space-lg) 0 var(--space-2xs)}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--space-xl)}
.note{font-size:var(--text-sm);color:var(--color-ink-2);margin-top:var(--space-xs);max-width:44em}
.scroll{overflow-x:auto}
.ledger{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
.ledger th{font:500 var(--text-xs) var(--font-body);color:var(--color-ink-2);text-align:left;padding:var(--space-2xs) var(--space-xs) var(--space-2xs) 0;border-bottom:var(--rule-ink);white-space:nowrap}
.ledger td{padding:var(--space-2xs) var(--space-xs) var(--space-2xs) 0;border-bottom:var(--rule);vertical-align:middle}
.ledger td.act{text-align:right;white-space:nowrap;padding-right:0}
.ledger td.act button+button{margin-left:var(--space-3xs)}
.ledger th.r,.ledger td.r{text-align:right}
.ledger td:first-child b{white-space:nowrap}
.ledger .sub{font-size:var(--text-xs);color:var(--color-ink-3)}
.ledger tr.dim td{color:var(--color-ink-3)}
.ledger tr.pick{cursor:pointer}
.ledger tr.pick:hover td{background:var(--color-paper-2)}
.ledger tr.on td{background:var(--color-paper-2);font-weight:600}
.stats{width:100%;border-collapse:collapse}
.stats th{font:500 var(--text-sm) var(--font-body);text-align:left;padding:var(--space-3xs) var(--space-sm) var(--space-3xs) 0;width:6.5rem}
.stats td{padding:var(--space-3xs) 0}
.stats td.num{text-align:right;width:2.5rem}
.stats tr.low th,.stats tr.low td.num{color:var(--color-down)}
.meter{display:block;height:3px;background:var(--color-rule)}
.meter i{display:block;height:100%;background:var(--color-ink)}
tr.low .meter i{background:var(--color-down)}
.meter.warn i{background:var(--color-warn)}
.meter.wide{margin:var(--space-xs) 0}

/* markets */
.mkt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:var(--space-xl);margin-top:var(--space-md);align-items:start}
.price{font:500 var(--text-xl) var(--font-mono);}
#chart{width:100%;height:13rem;display:block;margin:var(--space-sm) 0;border-top:var(--rule);border-bottom:var(--rule)}
.trade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3xs);margin-top:var(--space-xs)}

/* chirp */
.chirp{max-width:42rem}
.compose{display:flex;flex-wrap:wrap;gap:var(--space-2xs);align-items:center;padding:var(--space-sm) 0;border-bottom:var(--rule-ink)}
.compose .mut{width:100%;font-size:var(--text-sm)}
.feed{list-style:none;margin:0;padding:0}
.post{display:grid;grid-template-columns:2.25rem minmax(0,1fr);gap:var(--space-xs);padding:var(--space-sm) 0;border-bottom:var(--rule)}
.post.mine{background:var(--color-paper-2);padding-inline:var(--space-xs);margin-inline:calc(var(--space-xs) * -1)}
.av{width:2.25rem;height:2.25rem;display:grid;place-items:center;background:var(--color-paper-2);border:var(--rule);font:600 var(--text-md) var(--font-display)}
.post.mine .av{background:var(--color-ink);color:var(--color-paper);border-color:var(--color-ink)}
.by{font-size:var(--text-sm)}
.by .ver{color:var(--color-accent)}
.post p{margin:var(--space-3xs) 0;white-space:pre-line}
.tag{font-size:var(--text-xs);margin-left:var(--space-2xs);color:var(--color-accent)}
.tag.dn{color:var(--color-down)}

/* dialogs & slips */
#modal{position:fixed;inset:0;background:var(--color-scrim);display:grid;place-items:center;z-index:20;padding:var(--space-sm)}
#mbox{background:var(--color-paper-3);border-top:3px double var(--color-ink);max-width:34rem;width:100%;padding:var(--space-lg);max-height:90vh;overflow:auto;box-shadow:0 1rem 2.5rem var(--color-scrim)}
#mbox h2{font-size:var(--text-xl);line-height:1.05;margin:var(--space-3xs) 0 var(--space-sm)}
#mbox p{font-size:var(--text-md);color:var(--color-ink-2);margin-bottom:var(--space-sm)}
#mbox p b{color:var(--color-ink)}
#mbox .kicker{font-size:var(--text-sm);color:var(--color-ink-3)}
.choices{display:flex;flex-direction:column;gap:var(--space-2xs)}
.choices button{text-align:left;padding:.8rem 1rem;font-size:var(--text-base);white-space:normal}
.bgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-2xs);margin-top:var(--space-2xs)}
.bgs button{text-align:left;padding:var(--space-sm);white-space:normal}
.bgs b{display:block;font:600 var(--text-md) var(--font-display)}
.bgs small{display:block;color:var(--color-ink-2);font-size:var(--text-sm);margin-top:var(--space-3xs)}
.bgs button:hover:not(:disabled) small{color:var(--color-paper-2)}
label{display:block;font-size:var(--text-sm);color:var(--color-ink-2);margin-top:var(--space-sm)}
input{display:block;width:100%;margin-top:var(--space-3xs);background:var(--color-paper);border:var(--rule-ink);border-radius:var(--radius);padding:.7rem .8rem;color:var(--color-ink);font:400 var(--text-md) var(--font-body)}
input:focus-visible{outline:2px solid var(--color-focus);outline-offset:1px}
.row{display:flex;gap:var(--space-2xs);flex-wrap:wrap}
#toasts{position:fixed;left:var(--space-md);bottom:var(--space-md);display:flex;flex-direction:column;gap:var(--space-2xs);z-index:30;pointer-events:none}
.toast{background:var(--color-ink);color:var(--color-paper);padding:.55rem .9rem;font-size:var(--text-sm);max-width:22rem;animation:slip .2s var(--ease-out)}
@keyframes slip{from{opacity:0;transform:translateY(.5rem)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}button{transition:none}}

/* casino */
.back{border:0;padding:0;margin-bottom:var(--space-sm);color:var(--color-ink-2);background:none}
.back:hover:not(:disabled){background:none;color:var(--color-ink);text-decoration:underline}
.table{max-width:46rem;margin-top:var(--space-md)}
.dice{display:flex;gap:var(--space-sm)}
.dice span{width:5.5rem;height:5.5rem;display:grid;place-items:center;border:var(--rule-ink);border-radius:var(--radius);background:var(--color-paper-2);font:700 var(--text-2xl) var(--font-display)}
.coin{width:8rem;height:8rem;border-radius:50%;display:grid;place-items:center;border:3px double var(--color-accent);color:var(--color-accent);font:700 var(--text-lg) var(--font-display)}
/* trading screen */
.tbar{display:flex;flex-wrap:wrap;border-bottom:var(--rule);margin-bottom:var(--space-md)}
.tbar>div{padding:0 var(--space-md) var(--space-xs) 0;margin-right:var(--space-md);border-right:var(--rule)}
.tbar>div:last-child{border-right:0}
.tbar small{display:block;font-size:var(--text-xs);color:var(--color-ink-3)}
.tbar b{font-size:var(--text-md)}
.tui{display:grid;grid-template-columns:15rem minmax(0,1fr) 16rem;gap:var(--space-md);align-items:start}
.watch{border:var(--rule)}
.wh{display:flex;justify-content:space-between;padding:var(--space-2xs) var(--space-xs);font-size:var(--text-xs);color:var(--color-ink-3);border-bottom:var(--rule)}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto 4.6rem;gap:var(--space-2xs);align-items:center;width:100%;border:0;border-bottom:var(--rule);border-radius:0;text-align:left;padding:var(--space-2xs) var(--space-xs)}
.wrow:last-child{border-bottom:0}
.wrow small{display:block;font-size:var(--text-xs);color:var(--color-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow.on,.wrow:hover:not(:disabled){background:var(--color-paper-2);color:var(--color-ink)}
.pill{justify-self:end;min-width:4.4rem;text-align:center;padding:.2rem .35rem;border-radius:var(--radius);font:600 var(--text-xs) var(--font-mono);color:var(--color-paper)}
.pill.up{background:var(--color-up)}.pill.dn{background:var(--color-down)}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-sm)}
.qt{font-size:var(--text-lg)}.qt .mut{font-size:var(--text-md);font-weight:400}
.chip{font-size:var(--text-xs);color:var(--color-ink-2);border:var(--rule);padding:.15rem .5rem;border-radius:var(--radius);white-space:nowrap}
.stats4{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:var(--space-3xs) var(--space-md);padding:var(--space-xs) 0;margin-top:var(--space-xs);border-top:var(--rule);border-bottom:var(--rule)}
.stats4 div{display:flex;justify-content:space-between;gap:var(--space-2xs);font-size:var(--text-sm)}
.stats4 span{color:var(--color-ink-3)}
.tfbar{display:flex;gap:var(--space-3xs);margin-top:var(--space-sm);flex-wrap:wrap}
.tfbar button{padding:.3rem .6rem;font-size:var(--text-xs);border-color:var(--color-rule)}
.tfbar button.on{background:var(--color-ink);border-color:var(--color-ink);color:var(--color-paper)}
.tfbar .sp{flex:1}
#tchart{width:100%;height:20rem;display:block;margin-top:var(--space-2xs);cursor:crosshair}
.news{list-style:none;margin:0;padding:0}
.news li{padding:var(--space-2xs) 0;border-bottom:var(--rule);font-size:var(--text-sm)}
.news small{color:var(--color-ink-3);margin-right:var(--space-2xs)}
.ticket{border:var(--rule);padding:var(--space-sm);display:flex;flex-direction:column;gap:var(--space-xs)}
.seg{display:grid;grid-template-columns:1fr 1fr}
.seg button{border-radius:0;border-color:var(--color-rule)}
.seg button.on.buy{background:var(--color-up);border-color:var(--color-up);color:var(--color-paper)}
.seg button.on.sell{background:var(--color-down);border-color:var(--color-down);color:var(--color-paper)}
.ticket dl{display:grid;grid-template-columns:1fr auto;gap:var(--space-2xs);margin:0;font-size:var(--text-sm)}
.ticket dt{color:var(--color-ink-3)}.ticket dd{margin:0;text-align:right}
.qty{display:grid;grid-template-columns:2.75rem minmax(0,1fr) 2.75rem;align-items:center;text-align:center;border:var(--rule)}
.qty button{border:0;border-radius:0;font-size:var(--text-md)}
.qty b{font-size:var(--text-lg)}
.presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3xs)}
.presets button{padding:.35rem;border-color:var(--color-rule)}
.place{width:100%;padding:.85rem;font-size:var(--text-base);border:0;color:var(--color-paper)}
.place.buy,.place.buy:hover:not(:disabled){background:var(--color-up);color:var(--color-paper)}
.place.sell,.place.sell:hover:not(:disabled){background:var(--color-down);color:var(--color-paper)}
.place:hover:not(:disabled){filter:brightness(1.12)}
.place:disabled{background:var(--color-paper-2);color:var(--color-ink-3)}
@media (max-width:1280px){.tui{grid-template-columns:13rem minmax(0,1fr)}.ticket{grid-column:2}}
@media (max-width:860px){.tui{grid-template-columns:minmax(0,1fr)}.ticket{grid-column:auto}.watch{order:3}}
.chips{gap:var(--space-3xs)}
.chips button{padding:.4rem .55rem}
.chips button.on{background:var(--color-ink);border-color:var(--color-ink);color:var(--color-paper)}
.felt{border-top:var(--rule);border-bottom:var(--rule);padding:var(--space-xs) 0;min-height:10.5rem}
.hand{display:grid;grid-template-columns:5.5rem minmax(0,1fr);align-items:center;gap:var(--space-sm);padding:var(--space-2xs) 0}
.pc{vertical-align:top;display:inline-grid;place-items:center;width:2.6rem;height:3.6rem;margin:0 var(--space-2xs) var(--space-3xs) 0;border:var(--rule-ink);border-radius:var(--radius);background:var(--color-paper-2);font:600 var(--text-md) var(--font-display)}
.pc.red{color:var(--color-down)}
.pc.back{background:repeating-linear-gradient(45deg,var(--color-rule) 0 4px,var(--color-paper-2) 4px 8px)}
.result{margin:var(--space-xs) 0;color:var(--color-ink-2);min-height:1.5em}
.result b{color:var(--color-ink)}
.reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:var(--rule);border-bottom:var(--rule)}
.reels span{display:grid;place-items:center;height:5.5rem;font:700 var(--text-xl) var(--font-display);border-right:var(--rule)}
.reels span:last-child{border-right:0}
.rn{display:inline-grid;place-items:center;min-width:2.25rem;height:2.25rem;padding:0;font:600 var(--text-sm) var(--font-mono)}
.rn.red{color:var(--color-down)}.rn.g{color:var(--color-up)}
.wheel{display:flex;align-items:center;gap:var(--space-md);flex-wrap:wrap}
.rn.big{width:4.5rem;height:4.5rem;font-size:var(--text-xl);border:var(--rule-ink)}
.hist{display:flex;gap:var(--space-3xs);flex-wrap:wrap}
.hist .rn{border:var(--rule);min-width:1.9rem;height:1.9rem;font-size:var(--text-xs)}
.board{display:grid;grid-template-columns:repeat(13,2.25rem);gap:var(--space-3xs);margin-top:var(--space-sm)}
.board .g{grid-row:1/4;height:auto}
@media (max-width:1100px){.mkt,.cols{grid-template-columns:minmax(0,1fr);gap:0}}
@media (max-width:860px){
  body{height:auto;overflow:visible}
  .mast{padding:var(--space-sm) var(--space-sm) 0}
  .mast-top{grid-template-columns:minmax(0,1fr) auto}
  .wordmark{grid-column:1/-1;grid-row:1;text-align:left;font-size:var(--text-xl)}
  .dateline{grid-row:2}
  .ticker>div{margin-right:var(--space-sm);padding-right:var(--space-sm)}
  .ticker b{font-size:var(--text-base)}
  #inboxBtn{margin:var(--space-2xs) 0;width:100%}
  .page{display:block}
  main{padding:var(--space-md) var(--space-sm) var(--space-lg);overflow:visible}
  aside{border-left:0;border-top:var(--rule-ink);overflow:visible;padding:var(--space-md) var(--space-sm)}
  .lede{grid-template-columns:minmax(0,1fr);gap:var(--space-md)}
  .headline{font-size:var(--text-lg)}
  .bgs{grid-template-columns:minmax(0,1fr)}
  #mbox{padding:var(--space-md)}
}
</style>
</head>
<body>
<header class="mast">
  <div class="mast-top">
    <span class="dateline" id="dateline"></span>
    <h1 class="wordmark">The Hustle</h1>
    <div class="speed" id="speed"></div>
  </div>
  <div class="ticker">

  b.msg=p>21?'Bust.':nat&&!dnat?'Blackjack! Paid 3 to 2.':dnat&&!nat?'Dealer has blackjack.':ret>b.bet?(d>21?'Dealer busts. You win.':'You win.'):ret===b.bet?'Push. Your bet comes back.':'Dealer wins.';
  b.done=1;settle(b.bet,ret,'blackjack','bj')}
function netWorth(){let w=s.cash;for(const t in s.port)w+=s.port[t].sh*s.px[t].p;for(const id in s.biz)w+=s.biz[id].spent*.5;for(const id in s.own)w+=SM[id].cost*.6;for(const p of s.props)w+=pval(p)-p.loan;for(const c of s.cars)w+=c.v;return w+walletVal()}
function log(t,k='info'){s.log.unshift({d:s.day,t,k});if(s.log.length>80)s.log.pop()}
function chirp(h,n,x,v){s.feed.unshift({h,n,x,v,l:0,tl:rint(3,40)*(v?40:1),d:s.day});if(s.feed.length>60)s.feed.pop()}
function toast(m){const t=document.createElement('div');t.className='toast';t.innerHTML=m;$('#toasts').append(t);setTimeout(()=>t.remove(),2800)}

function newGame(name,bg,h={}){
  const b=BG[bg];
  s={v:1,name,handle:'@'+(name.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,15)||'you'),day:0,startAge:18,cash:b.cash+(h.inherit||0),st:{...b.st},edu:b.edu||0,study:null,
     job:b.job||null,jobDays:0,rank:0,biz:{},port:{},px:{},mkt:{bull:true},fol:b.fol||0,feed:[],own:{},wallet:{},cz:{chip:100,net:0,played:0,rh:[],ban:0},props:[],cars:[],home:null,re:{idx:1,list:[],next:0},cd:{},inbox:[],later:[],log:[],rel:0,kids:0,pet:0,
     gen:h.gen||1,boost:0,lastPost:0,dead:0,lastSeen:Date.now()};
  s.legacy=1+.25*(s.gen-1);
  for(const k of STOCKS)s.px[k.t]={p:k.p,o:k.p,h:[k.p]};
  for(let i=0;i<239;i++)marketDay(1);
  initCrypto();relist();
  log(h.gen?`${esc(name)} begins generation ${s.gen} with a ${fmt(h.inherit)} inheritance.`:`${esc(name)} turns 18 and moves out. Time to hustle.`,'good');
  chirp('@hustleculture','Hustle Culture','new week, new grind. what are you building? 👇',1);
}

// ---------- simulation ----------
function day(){
  s.day++;const A=age(),f=flows();
  s.cash+=f.job+f.biz+f.spon+f.rent-f.exp-f.mort;
  for(const p of s.props)if(p.loan>0){p.loan-=p.pay-p.loan*MR;if(p.loan<=1){p.loan=p.pay=0;log(`Paid off the mortgage on your ${pname(p)}.`,'good')}}
  s.re.idx*=Math.exp((s.mkt.bull?.00016:-.0001)+.0035*gauss());
  for(const c of s.cars){const k=CM[c.t];c.v=Math.max(k.price*.08,c.v*Math.exp(-k.dep/365+(k.vol?k.vol/19.1*gauss():0)))}
  if(s.day>=s.re.next)relist();
  for(const b of BIZ){const o=s.biz[b.id];if(o?.n&&!o.mgr){const g=bizInc(b,o);o.pend=Math.min(o.pend+g,g*CAP)}}
  if(s.cash<0){s.cash*=1.0003;add('hap',-.05)}
  if(s.job){s.jobDays++;if(s.jobDays%120===0&&s.st.hap>20){s.rank++;log(`Promoted to <b>${jobTitle()}</b>! Now ${fmt(jobPay())}/day.`,'good');toast('Promotion!')}}
  if(s.study&&--s.study.left<=0){const e=EDU[s.study.lvl];s.edu=s.study.lvl;add('sma',e.sma);s.study=null;log(`Graduated with a ${e.n}`,'good');toast('Graduated!')}
  const J=job();
  // stats drift toward a baseline, so an idle life is dull but survivable; choices push you above or below it
  add('hap',(50-s.st.hap)*.004-(J?J.str*.02:0)-(s.study?.03:0)+(s.rel?.03:0)+s.kids*.015+s.pet*.015+shopSum('hap')+(PM[homeP()?.t]?.hap||0)+(bestCar()?CM[bestCar().t].hap:0));
  add('hea',(85-Math.max(0,A-35)*1.2-s.st.hea)*.003+(s.st.hap>70?.01:0)-(s.st.hap<15?.04:0));
  if(A>30)add('loo',-.004);
  s.fol+=shopSum('fame')+carSum('fame')+s.props.reduce((t,p)=>t+(PM[p.t].fame||0),0);if(s.day-s.lastPost>30)s.fol*=.999;
  for(const p of s.feed)if(p.l<p.tl)p.l+=Math.ceil((p.tl-p.l)*.35);
  if(R()<.3)npcChatter();
  marketDay();cryptoDay();
  if(s.day%91===0)dividends();
  s.later=s.later.filter(p=>p.d>s.day||(runLater(p),false));
  s.inbox=s.inbox.filter(it=>{if(s.day-it.d<30)return true;const e=EVM[it.id];if(!e.c||e.c(s))log(`<b>${e.t}</b> (you never decided): ${e.ch[e.def][1](s,it.a)}`);return false});
  if(s.inbox.length<3&&R()<1/28)newEvent();
  const pd=s.st.hea<=0?1:A>60?Math.min(.5,((A-60)/30)**3*3)/365:0;
  if(R()<pd)die();
}
function marketDay(quiet){
  const M=s.mkt;
  if(R()<(M.bull?.003:.008)){M.bull=!M.bull;if(!quiet)chirp('@MarketWire','MarketWire',M.bull?'analysts call it: a new bull market has begun.':'stocks slide as recession fears grow. bear market territory.',1)}
  const m=(M.bull?.0005:-.0008)+gauss()*.007,sec={};
  for(const k of STOCKS){sec[k.sec]??=gauss()*.006;const q=s.px[k.t];q.o=q.p;q.p=Math.max(.01,q.p*Math.exp(k.mu-k.v*k.v/2+m*k.b+sec[k.sec]+k.v*gauss()));q.h.push(q.p);if(q.h.length>240)q.h.shift()}
  if(quiet)return;
  if(R()<.0006)crash();else if(R()<.05)news();
}
function shock(t,p){const q=s.px[t];q.p=Math.max(.01,q.p*(1+p));q.h[q.h.length-1]=q.p}
function news(){const k=pick(STOCKS),up=R()<.55,p=(up?1:-1)*(.06+R()*.16);shock(k.t,p);chirp('@MarketWire','MarketWire',`$${k.t} ${up?'▲':'▼'} ${Math.abs(p*100).toFixed(0)}% — ${pick(up?GOOD:BAD).replace('{n}',k.n)}`,1)}
function crash(){s.mkt.bull=false;s.re.idx*=.9;for(const c of s.cx.coins)if(!c.stable)c.p*=.7;for(const k of STOCKS)shock(k.t,-(.12+R()*.2));chirp('@MarketWire','MarketWire','FLASH CRASH: markets plunge across the board',1);log('The stock market crashed!','bad');toast('Market crash!')}
function dividends(){let t=0;for(const k of STOCKS){const h=s.port[k.t];if(h&&k.div)t+=h.sh*s.px[k.t].p*k.div/4}if(t>0){s.cash+=t;log(`Dividends paid: ${fmt(t)}`,'good')}}
function npcChatter(){const[h,n]=pick(NPC);chirp(h,n,s.fol>300&&R()<.15?pick(ABOUT).replace('{h}',s.handle):pick(CHAT))}
function runLater(p){
  if(p.k==='cash'){s.cash+=p.v;log(`${p.m} ${fmt(p.v)}`,'good');toast(`${p.m} ${fmt(p.v)}`)}
  else if(p.k==='shock'){shock(p.t,p.v);chirp('@MarketWire','MarketWire',`$${p.t} ${p.v>0?'rips':'tanks'} ${Math.round(Math.abs(p.v)*100)}% on rumors`,1)}
  else{log(p.m,'bad');toast(p.m)}
}
function newEvent(){
  const W=e=>typeof e.w==='function'?e.w(s):e.w,ok=EV.filter(e=>(!e.c||e.c(s))&&!s.inbox.some(i=>i.id===e.id));
  let r=R()*ok.reduce((t,e)=>t+W(e),0);
  for(const e of ok)if((r-=W(e))<=0){s.inbox.push({id:e.id,d:s.day,a:e.a?e.a(s):0});toast('A new decision is waiting');return}
}
function die(){s.dead=1;log(`${esc(s.name)} passed away at ${Math.floor(age())}.`,'bad');save();deathModal()}
function offline(ms){
  const sec=Math.min(ms,8*36e5)/1000;if(sec<60)return;
  let g=0;for(const b of BIZ){const o=s.biz[b.id];if(!o?.n)continue;const i=bizInc(b,o);if(o.mgr)g+=i;else o.pend=Math.min(i*CAP,o.pend+i*sec*.1)}
  const earn=g*sec*.1;if(earn<1)return; // ponytail: offline = 10% of real-time managed income, no aging, 8h cap
  s.cash+=earn;log(`Your managers earned ${fmt(earn)} while you were away.`,'good');
  modal(`<h2>While you were out</h2><p>You were away for <b>${dur(sec)}</b>. Your managers kept the lights on and earned <b class="num">${fmt(earn)}</b>.</p><button class="pri" data-a="close">Nice</button>`);
}
const dur=sec=>sec<3600?`${Math.round(sec/60)}m`:`${Math.floor(sec/3600)}h ${Math.round(sec%3600/60)}m`;

// ---------- actions ----------
const ACT={
  tab:x=>{tab=x;$('#view').scrollTop=0},
  spd:x=>speed=+x,
  sel:x=>sel=x,
  close:()=>closeModal(),
  act:id=>{const a=AM[id];if(s.day<(s.cd[id]||0)||s.cash<a.c)return;s.cash-=a.c;s.cd[id]=s.day+a.cd;toast(a.fx())},
  enroll:()=>{const e=EDU[s.edu+1];if(!e||s.study||s.cash<=0)return;s.cash-=e.cost;s.study={lvl:s.edu+1,left:e.days};log(`Enrolled in a ${e.n} (${e.days} days).`)},
  apply:id=>{const j=JM[id];if(!canJob(j))return;s.job=id;s.rank=0;s.jobDays=0;log(`Hired as <b>${j.n}</b>`,'good')},
  quit:()=>{log(`Quit your job as ${jobTitle()}.`);fire()},
  gig:()=>{s.cash+=gig();s.gigs=(s.gigs||0)+1},
  bbuy:(id,x)=>{const b=BM[id],o=s.biz[id]??={n:0,mgr:0,pend:0,spent:0},q=x==='max'?bmax(b,o.n):+x;if(q<1)return;const c=bcost(b,o.n,q);if(c>s.cash)return;
    const first=!o.n;s.cash-=c;o.spent+=c;const before=bmul(o.n);o.n+=q;
    if(first){log(`Opened your first ${b.n}`,'good');if(s.fol>100&&R()<.6)chirp(...pick(NPC),`just walked past ${s.handle}'s new ${b.n.toLowerCase()} ${pick(['love to see it','entrepreneur arc','the grind pays'])}`)}
    if(bmul(o.n)>before){log(`${b.n} milestone: ${o.n} units → income ×${bmul(o.n)}!`,'good');toast(`${b.n} income doubled`)}},
  mgr:id=>{const b=BM[id],o=s.biz[id],c=b.cost*12;if(!o||o.mgr||s.cash<c)return;s.cash-=c;o.spent+=c;o.mgr=1;s.cash+=o.pend;o.pend=0;log(`Hired a manager for your ${b.n}. It runs itself now.`,'good')},
  col:id=>{const o=s.biz[id];s.cash+=o.pend;o.pend=0},
  colAll:()=>{for(const id in s.biz){s.cash+=s.biz[id].pend;s.biz[id].pend=0}},
  buy:(t,x)=>{const p=s.px[t].p,n=x==='max'?Math.floor(s.cash/p):+x;if(n<1||n*p>s.cash)return;const h=s.port[t]??={sh:0,cost:0};h.sh+=n;h.cost+=n*p;s.cash-=n*p;log(`Bought ${big(n)} $${t} @ ${fmt(p)}`)},
  sell:(t,x)=>{const h=s.port[t];if(!h?.sh)return;const n=x==='all'?h.sh:Math.min(h.sh,+x),p=s.px[t].p,basis=h.cost*n/h.sh,g=n*p-basis;
    h.cost-=basis;h.sh-=n;s.cash+=n*p;log(`Sold ${big(n)} $${t} @ ${fmt(p)} (${g>=0?'+':''}${fmt(g)})`,g>=0?'good':'bad');if(!h.sh)delete s.port[t]},
  post:k=>{const P=POSTS[k];if(s.day<(s.cd.post||0)||(P.need&&!P.need()))return;
    const q=P.q()/100,viral=R()<(P.viral||.025),bad=P.risk&&R()<P.risk;
    let reach=(s.fol*.1+80)*(.4+q)*(.6+R()*.8);if(viral)reach*=8+R()*20;
    const gain=Math.round(bad?-s.fol*.03-5:reach*.07*(.5+q));s.fol=Math.max(0,s.fol+gain);
    const bz=BIZ.filter(b=>s.biz[b.id]?.n).pop();
    const x=pick(P.tx).replace('{nw}',fmt(netWorth())).replace('{stock}','$'+pick(STOCKS).t).replace('{biz}',bz?bz.n.toLowerCase():'business');
    s.feed.unshift({h:s.handle,n:s.name,x,me:1,l:0,tl:Math.round(reach*(bad?.1:.3)),d:s.day,tag:bad?"ratio'd":viral?'went viral':'',bad:bad?1:0});
    if(k==='shill')s.boost=s.day+10;

    toast(`${P.n}: ${gain>=0?'+':''}${big(gain)} followers${viral?', it went viral':bad?', and it backfired':''}`);
    if(viral)log(`Your ${P.n.toLowerCase()} went viral! +${big(gain)} followers`,'good')},
  pbuy:(u,x)=>{const i=s.re.list.findIndex(l=>l.uid===+u);if(i<0)return;const l=s.re.list[i],v=PM[l.t].base*l.m*s.re.idx,mort=x==='m';
    if(s.cash<(mort?v*.2:v)||(mort&&!canBorrow(v*.8)))return;
    s.cash-=mort?v*.2:v;const p={...l,paid:v,bought:s.day,loan:mort?v*.8:0,pay:mort?mpay(v*.8):0,from:s.day+rint(5,20)};
    s.props.push(p);s.re.list.splice(i,1,listing());if(!homeP()&&!PM[p.t].biz)s.home=p.uid;add('hap',5);
    log(`Bought ${art(pname(p))} for ${fmt(v)}${mort?' with a mortgage':''}${s.home===p.uid?', and moved in':''}.`,'good')},
  live:u=>{const p=P(+u);if(!p||PM[p.t].biz)return;const o=homeP();if(o)o.from=s.day+rint(5,20);s.home=p.uid;log(`Moved into your ${pname(p)}.`)},
  moveout:u=>{const p=P(+u);if(!p||s.home!==p.uid)return;s.home=null;p.from=s.day+rint(5,20);log(`Moved out of your ${pname(p)}. It goes up for rent.`)},
  payoff:u=>{const p=P(+u);if(!p?.loan||s.cash<p.loan)return;s.cash-=p.loan;p.loan=p.pay=0;log(`Paid off the mortgage on your ${pname(p)}.`,'good')},
  psell:u=>{const i=s.props.findIndex(p=>p.uid===+u);if(i<0)return;const p=s.props[i],v=pval(p);s.cash+=v*.97-p.loan;s.props.splice(i,1);if(s.home===p.uid)s.home=null;
    log(`Sold your ${pname(p)} for ${fmt(v)} (${v>=p.paid?'+':''}${fmt(v-p.paid)} on what you paid).`,v>=p.paid?'good':'bad')},
  cbuy:id=>{const k=CM[id];if(s.cash<k.price)return;s.cash-=k.price;s.cars.push({uid:uid(),t:id,paid:k.price,v:k.dep>0?k.price*.9:k.price,bought:s.day});add('hap',4);log(`Bought ${art(k.n.toLowerCase())}.`,'good')},
  csell:u=>{const i=s.cars.findIndex(c=>c.uid===+u);if(i<0)return;const c=s.cars[i];s.cash+=c.v;s.cars.splice(i,1);log(`Sold your ${CM[c.t].n.toLowerCase()} for ${fmt(c.v)}.`,c.v>=c.paid?'good':'bad')},
  xsel:x=>csel=x,
  xbuy:(k,x)=>{const c=coin(k),amt=x==='all'?s.cash:+x;if(!c||c.dead||amt<=0||amt>s.cash)return;const w=s.wallet[k]??={u:0,c:0};w.u+=amt*.99/c.p;w.c+=amt;s.cash-=amt;log(`Bought ${fmt(amt)} of $${k}.`)},
  xsell:(k,x)=>{const c=coin(k),w=s.wallet[k];if(!c||!w)return;const f=x==='all'?1:+x,u=w.u*f,v=u*c.p*.99,cost=w.c*f;w.u-=u;w.c-=cost;s.cash+=v;if(f===1)delete s.wallet[k];log(`Sold ${fmt(v)} of $${k} (${v>=cost?'+':''}${fmt(v-cost)}).`,v>=cost?'good':'bad')},
  chip:x=>{s.cz.chip=+x},
  cg:x=>{cg=x||null;$('#view').scrollTop=0},
  dice:k=>{const b=stake();if(!b)return;const a=rint(1,6),c=rint(1,6),n=a+c,m=k==='seven'?(n===7?5.8:0):(k==='under'?n<7:n>7)?2.35:0;s.cz.dice={a,b:c,w:b*m};settle(b,b*m,'dice','dice')},
  flip:k=>{const b=stake();if(!b)return;const r=R()<.5?'h':'t',m=r===k?1.96:0;s.cz.flip={r,w:b*m};settle(b,b*m,'the coin flip','coin')},
  tf:x=>{tf=x},cmode:x=>{cmode=x},
  side:x=>{ot.side=x},
  qty:x=>{const st=10**Math.max(0,Math.floor(Math.log10(Math.max(1,ot.qty-(x==='-'?1:0)))));ot.qty=Math.max(1,ot.qty+(x==='+'?st:-st))},
  qset:x=>{const p=s.px[sel].p,h=s.port[sel];ot.qty=x==='max'?Math.max(1,ot.side==='buy'?Math.floor(s.cash/p):h?.sh||1):+x},
  order:()=>{const n=ot.qty,p=s.px[sel].p;if(ot.side==='buy'){if(n*p>s.cash)return;ACT.buy(sel,n)}else{const h=s.port[sel];if(!h||h.sh<n)return;ACT.sell(sel,n)}toast(`Filled: ${ot.side==='buy'?'bought':'sold'} ${big(n)} ${sel} at ${fmt(p)}`)},
  deal:()=>{const b=stake();if(!b)return;const z=s.cz;z.bj={p:[drawCard(),drawCard()],d:[drawCard(),drawCard()],bet:b,done:0,msg:''};if(hv(z.bj.p)===21||hv(z.bj.d)===21)bjEnd()},

const gig=()=>4+s.st.sma*.15+(s.job?jobPay()*.02:0);

  const edge=(s.cash-c0)/3e5;ok(s.cz.played===3000&&edge>-.15&&edge<.08,'blackjack edge '+edge.toFixed(3));
  s.cash=1e5;ACT.xbuy('SATS','10000');const u0=s.wallet.SATS.u;ok(u0>0&&s.cash===9e4,'crypto buy');ACT.xsell('SATS','.5');ok(Math.abs(s.wallet.SATS.u-u0/2)<1e-12,'crypto sell half');
  s.cash=5e9;relist();ACT.pbuy(s.re.list[0].uid);ACT.pbuy(s.re.list[1].uid);s.props.at(-1).from=0;s.home=s.props[0].uid;ok(s.props.length===2,'two properties');s.cash=5e6;
  for(let i=0;i<1500;i++)cryptoDay();ok(s.cx.launched>0,'meme coins launch');ACT.xbuy(s.cx.coins[0].t,'1000');
  const base=JSON.stringify({...s,job:'swe',rel:1,fol:20000,cash:2e6,biz:{truck:{n:12,mgr:0,pend:0,spent:1e5},cafe:{n:3,mgr:1,pend:0,spent:1e5}},port:{NOVA:{sh:50,cost:5000}}});
  for(const e of EV)for(const[,fx]of e.ch){s=JSON.parse(base);s.st.hap=10;const m=fx(s,e.a?e.a(s):0);ok(typeof m==='string','event '+e.id)}
  for(const k in POSTS){s=JSON.parse(base);ACT.post(k)}
  for(const k in VIEWS){tab=k;VIEWS[k]()}for(const g of GAMES){cg=g.id;VIEWS.casino()}cg=null;
  s.cash=1e6;sel='NOVA';ot={side:'buy',qty:7};const n0=s.port.NOVA?.sh||0;ACT.order();ok(s.port.NOVA.sh===n0+7,'order ticket buys');ot.side='sell';ot.qty=3;ACT.order();ok(s.port.NOVA.sh===n0+4,'order ticket sells');ot={side:'buy',qty:10};
  s.cz.chip=100;for(let i=0;i<20000;i++){ACT.dice(['under','over','seven'][i%3]);ACT.flip(i%2?'h':'t')}const dg=s.cz.g.dice,cf=s.cz.g.coin;
  ok(dg.n===20000&&cf.n===20000&&dg.net/2e6>-.08&&dg.net/2e6<.02&&cf.net/2e6>-.05&&cf.net/2e6<.01,'dice and coin edges');
  newGame('Old','street');delete s.re;delete s.cx;delete s.cz;s.own={apt:1,car:1,bike:1};s.port.MOON={sh:10,cost:12};upgrade();ok(s.props.length===1&&s.cars.length===1&&s.own.bike&&homeP()&&s.wallet.MOON.u===10&&!s.port.MOON&&s.cz,'old saves upgrade');
  newGame('Sim','rich');let d=0;for(;d<40000&&!s.dead;d++){day();if(d%7===0){s.inbox=[];ACT.colAll()}}
  const vals=[s.cash,netWorth(),s.fol,...Object.values(s.st),...Object.values(s.px).map(q=>q.p),...s.cx.coins.map(c=>c.p),walletVal()];
  ok(vals.every(Number.isFinite),'finite after sim');ok(s.dead,'eventually dies');
  console.log(`self-test passed · simulated ${d} days, died at ${Math.floor(age())}`);
}

(function boot(){
  if(location.search.includes('test')){try{selfTest()}catch(e){console.error('self-test FAILED:',e.message)}s=null;tab='life';}
  let d=null;if(!wiped)try{d=JSON.parse(localStorage.getItem(SAVE))}catch{}
  if(d?.v===1){s=d;upgrade();render();if(s.dead)deathModal();else offline(Date.now()-s.lastSeen)}
  else startModal();
})();
</script>
