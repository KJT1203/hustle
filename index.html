<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Hustle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wordmark">The Hustle</div>
  <div class="ticker">
    <div><small>Cash</small><b id="hCash">—</b></div>
    <div><small>Net worth</small><b id="hNw">—</b></div>
    <div><small>Per day</small><b id="hInc">—</b></div>
    <div><small>Age</small><b id="hAge">—</b><span class="date" id="dateline"></span></div>
  </div>
  <button id="guideBtn" data-a="help" aria-label="Help and settings">?</button>
  <div class="speed" id="speed"></div>
  <button id="collectBtn" class="pri" data-a="colAll" hidden></button>
</header>
<div class="shell">
  <nav id="nav" class="rail" aria-label="Screens"></nav>
  <main id="view"></main>
  <aside><h2 id="statsH">How you are doing</h2><div class="sbars" id="sbars"></div><h2>The Record</h2><div id="log"></div></aside>
</div>
<nav id="tabbar" class="tabbar" aria-label="Sections"></nav>
<div id="coach" role="dialog" aria-label="Guide" hidden></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="modal" hidden><div id="mbox" role="dialog" aria-modal="true"></div></div>

<script src="game.js"></script>
</body>
</html>
