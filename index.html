.speed{margin-left:auto;display:flex;gap:4px}

nav .reset{font-size:12px;opacity:.6}

aside{grid-area:a;border-left:1px solid var(--ln);padding:0 16px 16px;overflow:auto}
aside h3{margin-top:18px}
button{font:inherit;color:inherit;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;cursor:pointer;transition:background .12s,border-color .12s}

button:disabled{opacity:.38;cursor:not-allowed}
button.pri{background:var(--up);color:#052816;border-color:transparent;font-weight:600}
button.pri:hover:not(:disabled){background:#6cf0b0}
button.bad{color:var(--dn)}
.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:16px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}

.num{font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--p2);border:1px solid var(--ln);font-size:12px;color:var(--mut)}

.bar{height:6px;background:var(--p2);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--up);border-radius:4px}
.stat{margin-bottom:10px}.stat .row{justify-content:space-between}
.profile{display:flex;gap:14px;align-items:center}
.avatar{font-size:44px;width:70px;height:70px;display:grid;place-items:center;background:var(--p2);border-radius:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.acts button{text-align:left;padding:10px 12px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}

.biz{display:flex;flex-direction:column;gap:10px}
.biz.locked{opacity:.45}
.biz .top{display:flex;gap:12px;align-items:center}
.biz .ic{font-size:30px;width:50px;height:50px;display:grid;place-items:center;background:var(--p2);border-radius:12px;flex:none}
.biz .btns{display:flex;gap:6px;flex-wrap:wrap}.biz .btns button{flex:1;padding:6px 8px;font-size:12.5px}
.mkt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px;align-items:start}
.list{padding:6px}
.srow{display:grid;grid-template-columns:62px minmax(0,1fr) auto 64px;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;padding:8px 10px}
.srow.on{background:var(--p2);border-color:var(--ln)}
.srow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.srow .r{text-align:right}
.srow b.held::after{content:'●';color:var(--gold);font-size:8px;vertical-align:super;margin-left:3px}
#chart{width:100%;height:210px;display:block;margin:10px 0}
.trade{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.chirp{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;max-width:640px}
.post{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ln)}
.post:last-child{border:0}
.post.mine{background:#4ade9b0b}
.post .txt{white-space:pre-line;margin:2px 0 4px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;color:#fff}
.ver{color:var(--acc)}
.tag{margin-left:6px;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--p2)}
.feed{padding:0}
.lg{padding:6px 0;border-bottom:1px solid #1d2229;font-size:12.5px}
.lg small{color:var(--mut);margin-right:6px;font-variant-numeric:tabular-nums}
.lg.good{color:#b9f5d6}.lg.bad{color:#ffc0c0}
.gig{font:700 22px 'Space Grotesk';padding:18px 26px;border-radius:14px}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:30;pointer-events:none}
.toast{background:#252b34;border:1px solid var(--ln);padding:9px 14px;border-radius:10px;box-shadow:0 6px 24px #0008;animation:tin .25s ease-out;max-width:320px}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
#modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:20;padding:16px}
#modal .card{max-width:520px;width:100%;padding:24px;max-height:90vh;overflow:auto}
#modal p{color:#c6ccd6}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.choices button{padding:11px 14px;text-align:left}
.bgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.bgs button{text-align:left;padding:12px}.bgs span{font-size:24px;display:block}.bgs small{display:block;color:var(--mut)}
label{display:block;color:var(--mut);font-size:12px;margin-top:14px}
input{display:block;width:100%;margin-top:6px;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;color:var(--ink);font:inherit;font-size:16px}
table{width:100%;border-collapse:collapse}td{padding:5px 0;border-bottom:1px solid var(--ln)}td:last-child{text-align:right}

@media(max-width:900px){

  nav .spacer{display:none}nav button{white-space:nowrap}
  header{position:sticky;top:0;z-index:5;gap:14px;padding:10px 16px}.hstats{gap:16px}.hstats b{font-size:15px}
  main{padding:16px;overflow:visible}aside{border:0;border-top:1px solid var(--ln);overflow:visible}
  .speed{margin-left:0}
}
</style>
</head>

const EVM=EM(EV.map(e=>[e.id,e]));

// ---------- state ----------
const SAVE='hustle-v1',GROW=1.13,CAP=10,MILES=[10,25,50,100,150,200,300,400,500];
let s=null,tab='life',sel='NOVA',speed=1,holding=false,wiped=false,heir={},hiddenAt=0;
const age=()=>s.startAge+s.day/365;
const add=(k,v)=>s.st[k]=clamp(s.st[k]+v,0,100);
const job=()=>s.job&&JM[s.job];
const jobPay=()=>job().pay*(1+.15*s.rank);
const jobTitle=()=>RANKS[Math.min(s.rank,4)]+job().n;
const fire=()=>{s.job=null;s.rank=0;s.jobDays=0};
const bmul=n=>2**MILES.filter(m=>n>=m).length;
const bizInc=(b,o)=>b.inc*o.n*bmul(o.n)*s.legacy*(s.day<s.boost?1.25:1);
const bcost=(b,n,q)=>b.cost*GROW**n*(GROW**q-1)/(GROW-1);
const bmax=(b,n)=>Math.floor(Math.log(s.cash*(GROW-1)/(b.cost*GROW**n)+1)/Math.log(GROW));
const buyout=id=>{const o=s.biz[id];return bcost(BM[id],Math.max(0,o.n-5),5)*2};
const shopSum=k=>SHOP.reduce((t,i)=>t+(s.own[i.id]?i[k]:0),0);
const sponsor=()=>s.fol<1000?0:s.fol*.0015*(.5+s.st.loo/100);
const expenses=()=>15+(SHOP.some(i=>i.home&&s.own[i.id])?0:30)+s.kids*35+(s.rel===2?10:0)+shopSum('up');
function flows(){const f={job:s.job?jobPay():0,biz:0,pend:0,spon:sponsor(),exp:expenses()};for(const b of BIZ){const o=s.biz[b.id];if(o?.n)f[o.mgr?'biz':'pend']+=bizInc(b,o)}return f}
function netWorth(){let w=s.cash;for(const t in s.port)w+=s.port[t].sh*s.px[t].p;for(const id in s.biz)w+=s.biz[id].spent*.5;for(const id in s.own)w+=SM[id].cost*.6;return w}
function log(t,k='info'){s.log.unshift({d:s.day,t,k});if(s.log.length>80)s.log.pop()}
function chirp(h,n,x,v){s.feed.unshift({h,n,x,v,l:0,tl:rint(3,40)*(v?40:1),d:s.day});if(s.feed.length>60)s.feed.pop()}
function toast(m){const t=document.createElement('div');t.className='toast';t.innerHTML=m;$('#toasts').append(t);setTimeout(()=>t.remove(),2800)}

function newGame(name,bg,h={}){
  const b=BG[bg];
  s={v:1,name,handle:'@'+(name.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,15)||'you'),day:0,startAge:18,cash:b.cash+(h.inherit||0),st:{...b.st},edu:b.edu||0,study:null,
     job:b.job||null,jobDays:0,rank:0,biz:{},port:{},px:{},mkt:{bull:true},fol:b.fol||0,feed:[],own:{},cd:{},inbox:[],later:[],log:[],rel:0,kids:0,pet:0,
     gen:h.gen||1,boost:0,lastPost:0,dead:0,lastSeen:Date.now()};
  s.legacy=1+.25*(s.gen-1);
  for(const k of STOCKS)s.px[k.t]={p:k.p,o:k.p,h:[k.p]};
  for(let i=0;i<239;i++)marketDay(1);
  log(h.gen?`${esc(name)} begins generation ${s.gen} with a ${fmt(h.inherit)} inheritance.`:`${esc(name)} turns 18 and moves out. Time to hustle.`,'good');
  chirp('@hustleculture','Hustle Culture','new week, new grind. what are you building? 👇',1);
}

// ---------- simulation ----------
function day(){
  s.day++;const A=age(),f=flows();
  s.cash+=f.job+f.biz+f.spon-f.exp;
  for(const b of BIZ){const o=s.biz[b.id];if(o?.n&&!o.mgr){const g=bizInc(b,o);o.pend=Math.min(o.pend+g,g*CAP)}}
  if(s.cash<0){s.cash*=1.0003;add('hap',-.05)}
  if(s.job){s.jobDays++;if(s.jobDays%120===0&&s.st.hap>20){s.rank++;log(`Promoted to <b>${jobTitle()}</b>! Now ${fmt(jobPay())}/day.`,'good');toast('🎉 Promotion!')}}
  if(s.study&&--s.study.left<=0){const e=EDU[s.study.lvl];s.edu=s.study.lvl;add('sma',e.sma);s.study=null;log(`Graduated with a ${e.n} 🎓`,'good');toast('🎓 Graduated!')}
  const J=job();
  // stats drift toward a baseline, so an idle life is dull but survivable; choices push you above or below it
  add('hap',(50-s.st.hap)*.004-(J?J.str*.02:0)-(s.study?.03:0)+(s.rel?.03:0)+s.kids*.015+s.pet*.015+shopSum('hap'));
  add('hea',(85-Math.max(0,A-35)*1.2-s.st.hea)*.003+(s.st.hap>70?.01:0)-(s.st.hap<15?.04:0));
  if(A>30)add('loo',-.004);
  s.fol+=shopSum('fame');if(s.day-s.lastPost>30)s.fol*=.999;
  for(const p of s.feed)if(p.l<p.tl)p.l+=Math.ceil((p.tl-p.l)*.35);
  if(R()<.3)npcChatter();
  marketDay();
  if(s.day%91===0)dividends();
  s.later=s.later.filter(p=>p.d>s.day||(runLater(p),false));
  s.inbox=s.inbox.filter(it=>{if(s.day-it.d<30)return true;const e=EVM[it.id];if(!e.c||e.c(s))log(`<b>${e.t}</b> (you never decided): ${e.ch[e.def][1](s,it.a)}`);return false});
  if(s.inbox.length<3&&R()<1/28)newEvent();
  const pd=s.st.hea<=0?1:A>60?Math.min(.5,((A-60)/30)**3*3)/365:0;
  if(R()<pd)die();
}
function marketDay(quiet){
  const M=s.mkt;
  if(R()<(M.bull?.003:.008)){M.bull=!M.bull;if(!quiet)chirp('@MarketWire','MarketWire',M.bull?'📈 analysts call it: a new bull market has begun.':'📉 stocks slide as recession fears grow. bear market territory.',1)}
  const m=(M.bull?.0005:-.0008)+gauss()*.007,sec={};
  for(const k of STOCKS){sec[k.sec]??=gauss()*.006;const q=s.px[k.t];q.o=q.p;q.p=Math.max(.01,q.p*Math.exp(k.mu-k.v*k.v/2+m*k.b+sec[k.sec]+k.v*gauss()));q.h.push(q.p);if(q.h.length>240)q.h.shift()}
  if(quiet)return;
  if(R()<.0006)crash();else if(R()<.05)news();
}
function shock(t,p){const q=s.px[t];q.p=Math.max(.01,q.p*(1+p));q.h[q.h.length-1]=q.p}
function news(){const k=pick(STOCKS),up=R()<.55,p=(up?1:-1)*(.06+R()*.16);shock(k.t,p);chirp('@MarketWire','MarketWire',`$${k.t} ${up?'▲':'▼'} ${Math.abs(p*100).toFixed(0)}% — ${pick(up?GOOD:BAD).replace('{n}',k.n)}`,1)}
function crash(){s.mkt.bull=false;for(const k of STOCKS)shock(k.t,-(.12+R()*.2));chirp('@MarketWire','MarketWire','🚨 FLASH CRASH: markets plunge across the board',1);log('The stock market crashed! 📉','bad');toast('🚨 Market crash!')}
function dividends(){let t=0;for(const k of STOCKS){const h=s.port[k.t];if(h&&k.div)t+=h.sh*s.px[k.t].p*k.div/4}if(t>0){s.cash+=t;log(`Dividends paid: ${fmt(t)}`,'good')}}
function npcChatter(){const[h,n]=pick(NPC);chirp(h,n,s.fol>300&&R()<.15?pick(ABOUT).replace('{h}',s.handle):pick(CHAT))}
function runLater(p){
  if(p.k==='cash'){s.cash+=p.v;log(`${p.m} ${fmt(p.v)} 💰`,'good');toast(`💰 ${p.m} ${fmt(p.v)}`)}
  else if(p.k==='shock'){shock(p.t,p.v);chirp('@MarketWire','MarketWire',`$${p.t} ${p.v>0?'rips':'tanks'} ${Math.round(Math.abs(p.v)*100)}% on rumors`,1)}
  else{log(p.m,'bad');toast(p.m)}
}
function newEvent(){
  const W=e=>typeof e.w==='function'?e.w(s):e.w,ok=EV.filter(e=>(!e.c||e.c(s))&&!s.inbox.some(i=>i.id===e.id));
  let r=R()*ok.reduce((t,e)=>t+W(e),0);
  for(const e of ok)if((r-=W(e))<=0){s.inbox.push({id:e.id,d:s.day,a:e.a?e.a(s):0});toast('📨 A new decision is waiting');return}
}
function die(){s.dead=1;log(`${esc(s.name)} passed away at ${Math.floor(age())}.`,'bad');save();deathModal()}
function offline(ms){
  const sec=Math.min(ms,8*36e5)/1000;if(sec<60)return;
  let g=0;for(const b of BIZ){const o=s.biz[b.id];if(!o?.n)continue;const i=bizInc(b,o);if(o.mgr)g+=i;else o.pend=Math.min(i*CAP,o.pend+i*sec*.1)}
  const earn=g*sec*.1;if(earn<1)return; // ponytail: offline = 10% of real-time managed income, no aging, 8h cap
  s.cash+=earn;log(`Your managers earned ${fmt(earn)} while you were away.`,'good');
  modal(`<h2>Welcome back 👋</h2><p>You were away for <b>${dur(sec)}</b>. Your managers kept the lights on and earned <b class="up">${fmt(earn)}</b>.</p><button class="pri" data-a="close">Nice</button>`);
}
const dur=sec=>sec<3600?`${Math.round(sec/60)}m`:`${Math.floor(sec/3600)}h ${Math.round(sec%3600/60)}m`;

// ---------- actions ----------
const ACT={
  tab:x=>{tab=x;$('#view').scrollTop=0},
  spd:x=>speed=+x,
  sel:x=>sel=x,
  close:()=>closeModal(),
  act:id=>{const a=AM[id];if(s.day<(s.cd[id]||0)||s.cash<a.c)return;s.cash-=a.c;s.cd[id]=s.day+a.cd;toast(`${a.ic} ${a.fx()}`)},
  enroll:()=>{const e=EDU[s.edu+1];if(!e||s.study||s.cash<=0)return;s.cash-=e.cost;s.study={lvl:s.edu+1,left:e.days};log(`Enrolled in a ${e.n} (${e.days} days).`)},
  apply:id=>{const j=JM[id];if(!canJob(j))return;s.job=id;s.rank=0;s.jobDays=0;log(`Hired as <b>${j.n}</b> ${j.ic}`,'good')},
  quit:()=>{log(`Quit your job as ${jobTitle()}.`);fire()},
  gig:()=>{s.cash+=gig();s.gigs=(s.gigs||0)+1},
  bbuy:(id,x)=>{const b=BM[id],o=s.biz[id]??={n:0,mgr:0,pend:0,spent:0},q=x==='max'?bmax(b,o.n):+x;if(q<1)return;const c=bcost(b,o.n,q);if(c>s.cash)return;
    const first=!o.n;s.cash-=c;o.spent+=c;const before=bmul(o.n);o.n+=q;
    if(first){log(`Opened your first ${b.n} ${b.ic}`,'good');if(s.fol>100&&R()<.6)chirp(...pick(NPC),`just walked past ${s.handle}'s new ${b.n.toLowerCase()} 👀 ${pick(['love to see it','entrepreneur arc','the grind pays'])}`)}
    if(bmul(o.n)>before){log(`${b.n} milestone: ${o.n} units → income ×${bmul(o.n)}!`,'good');toast(`${b.ic} Milestone! Income ×2`)}},
  mgr:id=>{const b=BM[id],o=s.biz[id],c=b.cost*12;if(!o||o.mgr||s.cash<c)return;s.cash-=c;o.spent+=c;o.mgr=1;s.cash+=o.pend;o.pend=0;log(`Hired a manager for your ${b.n}. It runs itself now.`,'good')},
  col:id=>{const o=s.biz[id];s.cash+=o.pend;o.pend=0},
  colAll:()=>{for(const id in s.biz){s.cash+=s.biz[id].pend;s.biz[id].pend=0}},
  buy:(t,x)=>{const p=s.px[t].p,n=x==='max'?Math.floor(s.cash/p):+x;if(n<1||n*p>s.cash)return;const h=s.port[t]??={sh:0,cost:0};h.sh+=n;h.cost+=n*p;s.cash-=n*p;log(`Bought ${big(n)} $${t} @ ${fmt(p)}`)},
  sell:(t,x)=>{const h=s.port[t];if(!h?.sh)return;const n=x==='all'?h.sh:Math.min(h.sh,+x),p=s.px[t].p,basis=h.cost*n/h.sh,g=n*p-basis;
    h.cost-=basis;h.sh-=n;s.cash+=n*p;log(`Sold ${big(n)} $${t} @ ${fmt(p)} (${g>=0?'+':''}${fmt(g)})`,g>=0?'good':'bad');if(!h.sh)delete s.port[t]},
  post:k=>{const P=POSTS[k];if(s.day<(s.cd.post||0)||(P.need&&!P.need()))return;
    const q=P.q()/100,viral=R()<(P.viral||.025),bad=P.risk&&R()<P.risk;
    let reach=(s.fol*.1+80)*(.4+q)*(.6+R()*.8);if(viral)reach*=8+R()*20;
    const gain=Math.round(bad?-s.fol*.03-5:reach*.07*(.5+q));s.fol=Math.max(0,s.fol+gain);
    const bz=BIZ.filter(b=>s.biz[b.id]?.n).pop();
    const x=pick(P.tx).replace('{nw}',fmt(netWorth())).replace('{stock}','$'+pick(STOCKS).t).replace('{biz}',bz?bz.n.toLowerCase():'business');
    s.feed.unshift({h:s.handle,n:s.name,x,me:1,l:0,tl:Math.round(reach*(bad?.1:.3)),d:s.day,tag:bad?"ratio'd 💀":viral?'🔥 viral':''});
    if(k==='shill')s.boost=s.day+10;
    s.cd.post=s.day+4;s.lastPost=s.day;add('hap',bad?-5:2);
    toast(`${P.ic} ${gain>=0?'+':''}${big(gain)} followers${viral?' — it went viral! 🔥':bad?' — backlash 💀':''}`);
    if(viral)log(`Your ${P.n.toLowerCase()} went viral! +${big(gain)} followers 🔥`,'good')},
  own:id=>{const i=SM[id];if(s.own[id]||s.cash<i.cost)return;s.cash-=i.cost;s.own[id]=1;add('hap',5);log(`Bought a ${i.n} ${i.ic}`,'good')},
  unown:id=>{if(!s.own[id])return;s.cash+=SM[id].cost*.6;delete s.own[id];log(`Sold your ${SM[id].n}.`)},
  inbox:()=>{const it=s.inbox[0];if(!it)return;const e=EVM[it.id];
    modal(`<small class="mut">📨 Decision · ${30-(s.day-it.d)} days to decide</small><h2 style="margin-top:6px">${e.t}</h2><p>${e.d(s,it.a)}</p><div class="choices">${e.ch.map((c,i)=>`<button data-a="choose" data-x="${i}">${c[0]}</button>`).join('')}</div>`)},
  choose:i=>{const it=s.inbox.shift(),e=EVM[it.id],msg=e.c&&!e.c(s)?'The moment has passed.':e.ch[+i][1](s,it.a);log(`<b>${e.t}</b>: ${msg}`);
    modal(`<h2>${e.t}</h2><p>${msg}</p><button class="pri" data-a="${s.inbox.length?'inbox':'close'}">${s.inbox.length?'Next decision →':'OK'}</button>`)},
  reset:()=>modal(`<h2>Start over?</h2><p>This wipes your save for good.</p><div class="row"><button class="bad" data-a="wipe">Wipe my save</button><button data-a="close">Cancel</button></div>`),
  wipe:()=>{wiped=true;localStorage.removeItem(SAVE);location.reload()},
  heir:()=>startModal({inherit:Math.max(0,netWorth()*.5),gen:s.gen+1,last:s.name}),
  begin:bg=>{newGame(($('#nm').value.trim()||pick(NAMES)).slice(0,20),bg,heir);closeModal();save()},
};
const gig=()=>4+s.st.sma*.15+(s.job?jobPay()*.02:0);
const canJob=j=>s.edu>=j.e&&s.st.sma>=j.s&&s.fol>=(j.f||0);

// ---------- modals ----------

function closeModal(){$('#modal').hidden=true;render()}

}
function deathModal(){
  const w=netWorth(),nb=BIZ.reduce((t,b)=>t+(s.biz[b.id]?.n||0),0);

  <table><tr><td>Net worth</td><td class="num">${fmt(w)}</td></tr><tr><td>Businesses</td><td>${nb}</td></tr><tr><td>Followers</td><td>${big(s.fol)}</td></tr><tr><td>Career</td><td>${s.job?jobTitle():'—'}</td></tr><tr><td>Family</td><td>${['Single','Partnered','Married'][s.rel]}${s.kids?`, ${s.kids} kid${s.kids>1?'s':''}`:''}</td></tr></table>
  <p>Your heir inherits half your net worth: <b class="up">${fmt(Math.max(0,w*.5))}</b>.</p><button class="pri" data-a="heir">Continue as your heir →</button>`);

},
};
const TABS=[['life','🧍 Life'],['work','💼 Work'],['biz','🏪 Business'],['stock','📈 Stocks'],['chirp','🐦 Chirp'],['shop','🛍️ Lifestyle']];

function hdr(){
  if(!s)return;const f=flows(),net=f.job+f.biz+f.pend+f.spon-f.exp;
  $('#hCash').textContent=fmt(s.cash);$('#hCash').className=s.cash<0?'dn':'';
  $('#hNw').textContent=fmt(netWorth());
  $('#hInc').textContent=(net>=0?'+':'')+fmt(net);$('#hInc').className=net>=0?'up':'dn';
  $('#hAge').textContent=`${Math.floor(age())}y ${s.day%365}d`;
  const n=s.inbox.length,ib=$('#inboxBtn');ib.hidden=!n;ib.textContent=`📨 ${n} decision${n>1?'s':''}`;
  $('#speed').innerHTML=[[0,'⏸'],[1,'1×'],[2,'2×'],[5,'5×'],[10,'10×']].map(([v,l])=>`<button class="${speed===v?'on':''}" data-a="spd" data-x="${v}">${l}</button>`).join('');
  $('#log').innerHTML=s.log.map(l=>`<div class="lg ${l.k}"><small>${Math.floor(s.startAge+l.d/365)}y</small>${l.t}</div>`).join('');
}
function render(){
  if(!s)return;hdr();
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="tab" data-x="${k}">${l}</button>`).join('')+'<div class="spacer"></div><button class="reset" data-a="reset">↺ New life</button>';
  $('#view').innerHTML=VIEWS[tab]();
  if(tab==='stock')drawChart();
}
function drawChart(){
  const c=$('#chart');if(!c)return;const dpr=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;
  const g=c.getContext('2d');g.scale(dpr,dpr);const h=s.px[sel].h,lo=Math.min(...h),hi=Math.max(...h),P=6;
  const X=i=>P+i/(h.length-1)*(W-P*2),Y=v=>H-P-(v-lo)/(hi-lo||1)*(H-P*2-12);
  const col=h[h.length-1]>=h[0]?'#4ade9b':'#ff6b6b',gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,col+'44');gr.addColorStop(1,col+'00');
  g.beginPath();h.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.strokeStyle=col;g.lineWidth=2;g.lineJoin='round';g.stroke();
  g.lineTo(X(h.length-1),H);g.lineTo(X(0),H);g.fillStyle=gr;g.fill();
  const p=s.port[sel];if(p){const a=p.cost/p.sh;if(a>=lo&&a<=hi){g.setLineDash([4,4]);g.strokeStyle='#8b94a3';g.lineWidth=1;g.beginPath();g.moveTo(P,Y(a));g.lineTo(W-P,Y(a));g.stroke();g.setLineDash([])}}
  g.fillStyle='#8b94a3';g.font='11px Inter,sans-serif';g.fillText(`${fmt(hi)} · ${h.length}d high`,P,11);g.fillText(fmt(lo),P,H-4);
}

// ---------- loop, input, save ----------
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;ACT[b.dataset.a](b.dataset.x,b.dataset.y);if(s&&$('#modal').hidden)render();else hdr()});
addEventListener('pointerdown',()=>holding=true);
addEventListener('pointerup',()=>holding=false);addEventListener('pointercancel',()=>holding=false);
let last=performance.now(),acc=0;
setInterval(()=>{
  const now=performance.now(),dt=now-last;last=now;
  if(!s||s.dead||!speed||document.hidden||!$('#modal').hidden)return; // decisions & dialogs pause time
  acc=Math.min(acc+dt*speed/1000,20);let n=0;
  while(acc>=1){acc--;day();n++;if(s.dead)break}
  if(n){if(holding)hdr();else render()} // ponytail: skip DOM rebuild mid-click so buttons don't vanish under the cursor
},100);
function save(){if(!s||wiped)return;s.lastSeen=Date.now();try{localStorage.setItem(SAVE,JSON.stringify(s))}catch{}}
setInterval(save,5000);addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(!s||s.dead)return;if(document.hidden){save();hiddenAt=Date.now()}else if(hiddenAt){offline(Date.now()-hiddenAt);hiddenAt=0;render()}});

function selfTest(){ // open with ?test=1 — never touches your real save
  wiped=true;const ok=(c,m)=>{if(!c)throw Error(m)};
  ok(fmt(1234)==='$1.23K','fmt K');ok(fmt(12.5)==='$12.50','fmt cents');ok(fmt(-2e6)==='-$2.00M','fmt neg');ok(bmul(25)===4,'milestones');
  ok(Math.abs(bcost(BIZ[0],0,2)-(120+120*GROW))<1e-6,'bcost sum');
  newGame('Test','street');s.cash=1e7;ACT.bbuy('lemon','max');ok(s.biz.lemon.n>=25&&bmax(BIZ[0],s.biz.lemon.n)===0,'buy max spends down');
  s.cash=1e6;ACT.buy('NOVA','10');ACT.sell('NOVA','all');ok(!s.port.NOVA,'sell all');
  const base=JSON.stringify({...s,job:'swe',rel:1,fol:20000,cash:2e6,biz:{truck:{n:12,mgr:0,pend:0,spent:1e5},cafe:{n:3,mgr:1,pend:0,spent:1e5}},port:{NOVA:{sh:50,cost:5000}}});
  for(const e of EV)for(const[,fx]of e.ch){s=JSON.parse(base);s.st.hap=10;const m=fx(s,e.a?e.a(s):0);ok(typeof m==='string','event '+e.id)}
  for(const k in POSTS){s=JSON.parse(base);ACT.post(k)}
  for(const k in VIEWS){tab=k;VIEWS[k]()}
  newGame('Sim','rich');let d=0;for(;d<40000&&!s.dead;d++){day();if(d%7===0){s.inbox=[];ACT.colAll()}}
  const vals=[s.cash,netWorth(),s.fol,...Object.values(s.st),...Object.values(s.px).map(q=>q.p)];
  ok(vals.every(Number.isFinite),'finite after sim');ok(s.dead,'eventually dies');
  console.log(`self-test passed · simulated ${d} days, died at ${Math.floor(age())}`);
}

(function boot(){
  if(location.search.includes('test')){try{selfTest()}catch(e){console.error('self-test FAILED:',e.message)}s=null;tab='life';}
  let d=null;if(!wiped)try{d=JSON.parse(localStorage.getItem(SAVE))}catch{}
  if(d?.v===1){s=d;render();if(s.dead)deathModal();else offline(Date.now()-s.lastSeen)}
  else startModal();
})();
</script>
